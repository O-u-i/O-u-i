<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="760"
  viewBox="0 0 1200 760"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Soren Fragments</title>
  <desc id="desc">
    A GitHub profile fragments card about philosophy, finance and agent systems.
  </desc>

  <defs>
    <!-- soft shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <!-- subtle panel gradient -->
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#10141B"/>
    </linearGradient>

    <linearGradient id="topPanelFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="50%" stop-color="#11161D"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>

    <style>
      .title {
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 650;
        fill: #F5F2EC;
        letter-spacing: -0.6px;
      }

      .body {
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
        font-size: 15px;
        font-weight: 430;
        fill: #F5F2EC;
      }

      .copy {
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 430;
        fill: #F5F2EC;
      }

      .line {
        stroke: #2A313D;
        stroke-width: 1;
        shape-rendering: geometricPrecision;
      }
    </style>
  </defs>

  <!-- transparent background -->

  <!-- TOP PHILOSOPHY CARD -->
  <g filter="url(#cardShadow)">
    <rect
      x="110"
      y="72"
      width="980"
      height="204"
      rx="12"
      fill="url(#topPanelFill)"
      stroke="#242B36"
      stroke-width="1"
    />
  </g>

  <!-- LEFT CARD -->
  <g filter="url(#cardShadow)">
    <rect
      x="110"
      y="316"
      width="468"
      height="304"
      rx="12"
      fill="url(#panelFill)"
      stroke="#242B36"
      stroke-width="1"
    />
  </g>

  <!-- RIGHT CARD -->
  <g filter="url(#cardShadow)">
    <rect
      x="622"
      y="316"
      width="468"
      height="304"
      rx="12"
      fill="url(#panelFill)"
      stroke="#242B36"
      stroke-width="1"
    />
  </g>

  <!-- PHILOSOPHY TEXT -->
  <g class="copy">
    <text x="148" y="124">
      <tspan x="148" dy="0">I do not know which projects will matter, or where this path will lead.</tspan>
      <tspan x="148" dy="34">What remains are fragments — projects, questions, failures and unfinished attempts —</tspan>
      <tspan x="148" dy="34">quietly shaping how I think, what I build, and whatever comes next.</tspan>
    </text>
  </g>

  <!-- LEFT TITLE -->
  <text class="title" x="136" y="372">FINANCE / PORTFOLIO</text>
  <line class="line" x1="136" y1="400" x2="552" y2="400"/>

  <!-- LEFT ROW 1 -->
  <text class="body" x="136" y="452">Portfolio Management</text>
  <text class="body" x="358" y="452">Asset Allocation</text>
  <line class="line" x1="136" y1="478" x2="552" y2="478"/>

  <!-- LEFT ROW 2 -->
  <text class="body" x="136" y="528">Risk / Return</text>
  <text class="body" x="358" y="528">Position Review</text>
  <line class="line" x1="136" y1="554" x2="552" y2="554"/>

  <!-- LEFT ROW 3 -->
  <text class="body" x="136" y="604">Decision Frameworks</text>
  <text class="body" x="358" y="604">Portfolio Analytics</text>

  <!-- RIGHT TITLE -->
  <text class="title" x="648" y="372">AGENT / HARNESS</text>
  <line class="line" x1="648" y1="400" x2="1064" y2="400"/>

  <!-- RIGHT ROW 1 -->
  <text class="body" x="648" y="452">Harness Design</text>
  <text class="body" x="870" y="452">Agent Runtime</text>
  <line class="line" x1="648" y1="478" x2="1064" y2="478"/>

  <!-- RIGHT ROW 2 -->
  <text class="body" x="648" y="528">Workflow / Orchestration</text>
  <text class="body" x="870" y="528">Context / Memory</text>
  <line class="line" x1="648" y1="554" x2="1064" y2="554"/>

  <!-- RIGHT ROW 3 -->
  <text class="body" x="648" y="604">Tools / MCP</text>
  <text class="body" x="870" y="604">Evaluation / Guardrails</text>
</svg>
