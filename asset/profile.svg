<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="760"
  viewBox="0 0 1200 760"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Soren Fragments</title>
  <desc id="desc">
    A GitHub profile fragments card about philosophy, finance and agent systems.
  </desc>

  <defs>
    <!-- soft shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.22"
      />
    </filter>

    <!-- subtle panel gradient -->
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#10141B"/>
    </linearGradient>

    <linearGradient id="topPanelFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="50%" stop-color="#11161D"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>

    <style>
      .title {
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
        font-size: 30px;
        font-weight: 650;
        fill: #F5F2EC;
        letter-spacing: -0.75px;
      }

      .body {
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: 430;
        fill: #F5F2EC;
      }

      .copy {
        font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
        font-size: 17px;
        font-weight: 430;
        fill: #F5F2EC;
      }

      .line {
        stroke: #2A313D;
        stroke-width: 1;
        shape-rendering: geometricPrecision;
      }
    </style>
  </defs>

  <!-- transparent background -->

  <!-- ========================================================= -->
  <!-- TOP PHILOSOPHY CARD -->
  <!-- ========================================================= -->

  <g filter="url(#cardShadow)">
    <rect
      x="40"
      y="38"
      width="1120"
      height="230"
      rx="12"
      fill="url(#topPanelFill)"
      stroke="#242B36"
      stroke-width="1"
    />
  </g>

  <!-- ========================================================= -->
  <!-- LEFT CARD -->
  <!-- ========================================================= -->

  <g filter="url(#cardShadow)">
    <rect
      x="40"
      y="304"
      width="535"
      height="402"
      rx="12"
      fill="url(#panelFill)"
      stroke="#242B36"
      stroke-width="1"
    />
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT CARD -->
  <!-- ========================================================= -->

  <g filter="url(#cardShadow)">
    <rect
      x="625"
      y="304"
      width="535"
      height="402"
      rx="12"
      fill="url(#panelFill)"
      stroke="#242B36"
      stroke-width="1"
    />
  </g>

  <!-- ========================================================= -->
  <!-- PHILOSOPHY TEXT -->
  <!-- ========================================================= -->

  <g class="copy">
    <text x="82" y="102">
      <tspan x="82" dy="0">
        I do not know which projects will matter, or where this path will lead.
      </tspan>

      <tspan x="82" dy="42">
        What remains are fragments — projects, questions, failures and unfinished attempts —
      </tspan>

      <tspan x="82" dy="42">
        quietly shaping how I think, what I build, and whatever comes next.
      </tspan>
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- LEFT / FINANCE -->
  <!-- ========================================================= -->

  <text class="title" x="72" y="370">
    FINANCE / PORTFOLIO
  </text>

  <line
    class="line"
    x1="72"
    y1="407"
    x2="543"
    y2="407"
  />

  <!-- ROW 1 -->

  <text class="body" x="72" y="470">
    Portfolio Management
  </text>

  <text class="body" x="338" y="470">
    Asset Allocation
  </text>

  <line
    class="line"
    x1="72"
    y1="505"
    x2="543"
    y2="505"
  />

  <!-- ROW 2 -->

  <text class="body" x="72" y="568">
    Risk / Return
  </text>

  <text class="body" x="338" y="568">
    Position Review
  </text>

  <line
    class="line"
    x1="72"
    y1="603"
    x2="543"
    y2="603"
  />

  <!-- ROW 3 -->

  <text class="body" x="72" y="666">
    Decision Frameworks
  </text>

  <text class="body" x="338" y="666">
    Portfolio Analytics
  </text>

  <!-- ========================================================= -->
  <!-- RIGHT / AGENT -->
  <!-- ========================================================= -->

  <text class="title" x="657" y="370">
    AGENT / HARNESS
  </text>

  <line
    class="line"
    x1="657"
    y1="407"
    x2="1128"
    y2="407"
  />

  <!-- ROW 1 -->

  <text class="body" x="657" y="470">
    Harness Design
  </text>

  <text class="body" x="923" y="470">
    Agent Runtime
  </text>

  <line
    class="line"
    x1="657"
    y1="505"
    x2="1128"
    y2="505"
  />

  <!-- ROW 2 -->

  <text class="body" x="657" y="568">
    Workflow / Orchestration
  </text>

  <text class="body" x="923" y="568">
    Context / Memory
  </text>

  <line
    class="line"
    x1="657"
    y1="603"
    x2="1128"
    y2="603"
  />

  <!-- ROW 3 -->

  <text class="body" x="657" y="666">
    Tools / MCP
  </text>

  <text class="body" x="923" y="666">
    Evaluation / Guardrails
  </text>
</svg>
